http:
  routers:
    openapi-aggregator:
      rule: "Path(`/openapi.json`) || Path(`/sources`)"
      entryPoints: ["web"]
      service: openapi-aggregator
      priority: 20
    queue-api:
      rule: "PathPrefix(`/`)"
      entryPoints: ["web"]
      service: queue-api
      middlewares: ["rl"]

  services:
    openapi-aggregator:
      loadBalancer:
        servers:
          - url: "http://openapi-aggregator:8083"
    queue-api:
      loadBalancer:
        servers:
          - url: "http://queue-api:8081"

  middlewares:
    rl:
      plugin:
        clusterRatelimit:
          average: 20
          burst: 40
          period: 1
          redisAddress: "redis:6379"
          redisPassword: "$REDIS_PASSWORD"
          redisDb: 0
