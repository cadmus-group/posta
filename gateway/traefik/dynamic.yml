http:
  routers:
    queue-api:
      rule: "PathPrefix(`/`)"
      entryPoints: ["web"]
      service: queue-api
      middlewares: ["rl"]

  services:
    queue-api:
      loadBalancer:
        servers:
          - url: "http://queue-api:8081"

  middlewares:
    rl:
      plugin:
        clusterRatelimit:
          average: 20
          burst: 40
          period: 1
          redisAddress: "redis:6379"
          redisPassword: "$REDIS_PASSWORD"
          redisDb: 0
