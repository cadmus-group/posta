name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Smoke test (docker compose)
        env:
          SMOKE_ENABLE_AUTH: "1"
          ENQUEUE_AUTH_TOKEN: "ci-smoke-token"
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh

