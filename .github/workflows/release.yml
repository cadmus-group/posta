name: release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release-please:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Release Please
        uses: google-github-actions/release-please-action@v4
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  publish-images:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Prepare tags
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR="${TAG%%.*}"
          MINOR="${TAG#*.}"
          MINOR="${MINOR%%.*}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tagv=v${TAG}" >> "$GITHUB_OUTPUT"
          echo "tagv_major=v${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "tagv_minor=v${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push queue-api image
        run: |
          docker buildx build --push --platform linux/amd64 \
            --build-arg VERSION=${{ steps.vars.outputs.tagv }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -f Dockerfile.queue-api \
            -t ghcr.io/${{ github.repository_owner }}/posta-queue-api:${{ steps.vars.outputs.tagv }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-queue-api:${{ steps.vars.outputs.tagv_minor }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-queue-api:${{ steps.vars.outputs.tagv_major }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-queue-api:latest .

      - name: Build and push worker image
        run: |
          docker buildx build --push --platform linux/amd64 \
            --build-arg VERSION=${{ steps.vars.outputs.tagv }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -f Dockerfile.worker \
            -t ghcr.io/${{ github.repository_owner }}/posta-worker:${{ steps.vars.outputs.tagv }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-worker:${{ steps.vars.outputs.tagv_minor }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-worker:${{ steps.vars.outputs.tagv_major }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-worker:latest .

      - name: Build and push scheduler image
        run: |
          docker buildx build --push --platform linux/amd64 \
            --build-arg VERSION=${{ steps.vars.outputs.tagv }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -f Dockerfile.scheduler \
            -t ghcr.io/${{ github.repository_owner }}/posta-scheduler:${{ steps.vars.outputs.tagv }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-scheduler:${{ steps.vars.outputs.tagv_minor }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-scheduler:${{ steps.vars.outputs.tagv_major }} \
            -t ghcr.io/${{ github.repository_owner }}/posta-scheduler:latest .

