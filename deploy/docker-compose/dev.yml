services:
  redis:
    image: redis:7-alpine
    env_file: ../../.env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379" # dev only

  traefik:
    image: traefik:v3.2
    env_file: ../../.env
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../gateway/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on: [redis, queue-api, openapi-aggregator]

  openapi-aggregator:
    build:
      context: ../..
      dockerfile: Dockerfile.openapi-aggregator
    env_file: ../../.env
    environment:
      - HTTP_ADDR=:8083
      - OPENAPI_SOURCES_FILE=/app/openapi-sources.example.yaml
    volumes:
      - ../../config/openapi-sources.example.yaml:/app/openapi-sources.example.yaml:ro
      - ../../api/openapi.yaml:/app/api/openapi.yaml:ro
    depends_on: [queue-api]

  queue-api:
    build:
      context: ../..
      dockerfile: Dockerfile.queue-api
    env_file: ../../.env
    environment:
      - HTTP_ADDR=:8081
      - REDIS_ADDR=redis:6379
      - ENQUEUE_AUTH_TOKEN=${ENQUEUE_AUTH_TOKEN:-}
      - QUEUE_ALLOWLIST=${QUEUE_ALLOWLIST:-}
      - EDGE_ALLOWED_QUEUES=${EDGE_ALLOWED_QUEUES:-}
      - EDGE_ALLOWED_TASK_TYPES=${EDGE_ALLOWED_TASK_TYPES:-}
      - EDGE_MODULES=${EDGE_MODULES:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on: [redis]

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file: ../../.env
    environment:
      - REDIS_ADDR=redis:6379
      - EDGE_MODULES=${EDGE_MODULES:-}
      - EDGE_ALLOWED_TASK_TYPES=${EDGE_ALLOWED_TASK_TYPES:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on: [redis]

  scheduler:
    build:
      context: ../..
      dockerfile: Dockerfile.scheduler
    env_file: ../../.env
    environment:
      - REDIS_ADDR=redis:6379
      - EDGE_MODULES=${EDGE_MODULES:-}
      - EDGE_ALLOWED_TASK_TYPES=${EDGE_ALLOWED_TASK_TYPES:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on: [redis]

  asynqmon:
    image: hibiken/asynqmon
    ports: ["8082:8080"]
    command: ["--redis-addr=redis:6379", "--redis-password=${REDIS_PASSWORD:-}"]
    depends_on: [redis]

volumes:
  redis-data:

networks:
  default:
    name: posta-network
    external: true