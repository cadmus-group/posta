version: "3.9"

services:
  traefik:
    image: traefik:v3.2
    env_file: ../../.env
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.lets-encrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.lets-encrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.lets-encrypt.acme.email=${LETS_ENCRYPT_EMAIL:-ops@example.com}"
      - "--certificatesresolvers.lets-encrypt.acme.storage=/acme/acme.json"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../gateway/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../gateway/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-acme:/acme
    depends_on:
      - openapi-aggregator
      - queue-api

  openapi-aggregator:
    build:
      context: ../..
      dockerfile: Dockerfile.openapi-aggregator
    env_file: ../../.env
    environment:
      - HTTP_ADDR=:8083
      - OPENAPI_SOURCES_FILE=/config/openapi-sources.yaml
    volumes:
      - ../../config/openapi-sources.yaml:/config/openapi-sources.yaml:ro
      - ../../api/openapi.yaml:/app/api/openapi.yaml:ro
    depends_on:
      - queue-api

  queue-api:
    build:
      context: ../..
      dockerfile: Dockerfile.queue-api
    env_file: ../../.env
    environment:
      - HTTP_ADDR=:8081
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - ENQUEUE_AUTH_TOKEN=${ENQUEUE_AUTH_TOKEN:-}
      - QUEUE_ALLOWLIST=${QUEUE_ALLOWLIST:-}
      - EDGE_ALLOWED_QUEUES=${EDGE_ALLOWED_QUEUES:-}
      - EDGE_ALLOWED_TASK_TYPES=${EDGE_ALLOWED_TASK_TYPES:-}
      - EDGE_MODULES=${EDGE_MODULES:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on:
      - redis

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    env_file: ../../.env
    environment:
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - EDGE_MODULES=${EDGE_MODULES:-}
      - EDGE_ALLOWED_TASK_TYPES=${EDGE_ALLOWED_TASK_TYPES:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on:
      - redis

  scheduler:
    build:
      context: ../..
      dockerfile: Dockerfile.scheduler
    env_file: ../../.env
    environment:
      - REDIS_ADDR=${REDIS_ADDR:-redis:6379}
      - EDGE_MODULES=${EDGE_MODULES:-}
      - EDGE_ALLOWED_TASK_TYPES=${EDGE_ALLOWED_TASK_TYPES:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    env_file: ../../.env
    command: >
      sh -c "if [ -n \"${REDIS_PASSWORD}\" ]; then
      echo \"requirepass ${REDIS_PASSWORD}\" > /etc/redis.conf;
      redis-server /etc/redis.conf;
      else redis-server; fi"
    volumes:
      - redis-data:/data
    expose:
      - "6379"

volumes:
  redis-data:
  traefik-acme:

